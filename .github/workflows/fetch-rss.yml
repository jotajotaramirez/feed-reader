name: Update Welele Archive

on:
  schedule:
    # Run every day at 00:00, 06:00, 12:00, and 18:00 UTC.
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allow manual runs from GitHub.

jobs:
  fetch-rss:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install RSS parser
        run: npm ci --omit=dev

      - name: Fetch and archive Welele RSS
        run: node scripts/fetch_rss.js

      - name: Commit new articles
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-archivar nuevas entradas de Welele"
          file_pattern: "welele_archive.json"
          commit_user_name: "Welele Bot"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "Welele Bot <github-actions[bot]@users.noreply.github.com>"
